version: '3.8'

services:

  app:
    build: .
    restart: unless-stopped
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - bot-network

  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - bot-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bot-network

  celery_worker:
    build: .
    restart: unless-stopped
    command: python -m celery -A celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - bot-network

  celery_beat:
    build: .
    restart: unless-stopped
    command: python -m celery -A celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - celery_worker
    networks:
      - bot-network

  # Draws the picture cards (render/). It holds no secrets and has no network: only
  # the job directory is shared with the bot. Stopped, the bot answers in text.
  render:
    build: ./render
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.5
    environment:
      - RENDER_KEEP_DAYS=2
    volumes:
      - render_jobs:/render
    healthcheck:
      test: ["CMD", "python", "watcher.py", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegram_bot:
    build: .
    restart: unless-stopped
    command: python bot.py
    volumes:
      - .:/app
      - render_jobs:/render
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - db
      - redis
      - render
    networks:
      - bot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  render_jobs:

networks:
  bot-network:
    driver: bridge